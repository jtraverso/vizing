# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Vizing's theorem and equitable edge colourings"
  description: >-
    A Lean 4 / Mathlib formalization of Vizing's theorem: every finite simple graph G has a
    proper edge colouring with Δ(G) + 1 colours, stated with Mathlib's line graph
    (G.lineGraph is (Δ(G) + 1)-colourable, hence χ'(G) ≤ Δ(G) + 1), proved with fans and Kempe
    chain exchanges. It also proves the equitable refinement: for every c ≥ Δ(G) + 1 there is a
    proper edge colouring with colours Fin c in which any two colour classes (including unused
    colours) differ in size by at most one (McDiarmid 1972), obtained by balancing a Vizing
    colouring with alternating-component moves that strictly decrease a square energy. Version 2
    adds the lower bound Δ(G) ≤ χ'(G) (the edges at a vertex of maximum degree form a clique of the
    line graph) and hence the dichotomy χ'(G) ∈ {Δ(G), Δ(G) + 1} (class 1 / class 2).
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15"]

sources:
  - title: "On an estimate of the chromatic class of a p-graph (Russian)"
    authors:
      - "Vadim G. Vizing"
    type: "paper"
    location: "Diskretnyi Analiz 3 (1964), 25–30"
    relationship: "formalizes"
    note: "The upper bound χ'(G) ≤ Δ(G) + 1 for simple graphs, by the standard fan / Kempe-chain argument."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "The Solution of a Timetabling Problem"
    authors:
      - "Colin McDiarmid"
    id: "doi:10.1093/imamat/9.1.23"
    type: "paper"
    location: "IMA Journal of Applied Mathematics 9 (1972), 23–34"
    relationship: "formalizes"
    note: >-
      Source of the equitable statement: if a graph has a proper edge colouring with k colours,
      then for every k' ≥ k it has a proper edge colouring with k' colours whose colour classes
      differ in size by at most one. The Lean theorem `Vizing.exists_equitable_edge_colouring`
      is this statement for simple graphs with k = Δ(G) + 1 supplied by Vizing's theorem; the
      Lean proof rebalances on the fixed palette Fin c by the alternating-path argument (two
      classes differing by at least two span a union of alternating paths and cycles, one path
      has more edges of the larger class, and swapping its colours strictly decreases the sum of
      squares of the class sizes).
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Equitable colorations of graphs"
    authors:
      - "Dominique de Werra"
    id: "doi:10.1051/m2an/197105r300031"
    type: "paper"
    location: "Revue française d'informatique et de recherche opérationnelle, Série rouge 5 (1971), no. R3, 3–8"
    relationship: "background"
    note: "Early work on equitable (balanced) colourings; background for the equitable statement."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Paper IV (Erdős problem #81 for chordal graphs), Lean formalization freeze"
    authors:
      - "Juan Pablo Traverso Gianini"
    type: "other"
    location: "https://github.com/jtraverso/erdos-81-chordal-clique-partitions at ff2019f56a50cf300a6531c9f8d4a8fb1a541e3d, preprints/PAPER_IV/05_formalization"
    relationship: "background"
    note: "The edge-colouring modules were first developed there and then extracted and generalised for Lean Pool."
    license: "Apache-2.0"
    author_endorsement: "n/a"

related_formalizations:
  - id: "LeanPool/lean-pool, project Vizing (PR #578, merged 2026-10-03)"
    relationship: "builds-on"
    note: >-
      The same author's contribution to Lean Pool; the modules under LeanPool/Vizing are copied
      verbatim from LeanPool/lean-pool at commit 26ce45d3871e5560a8baffa4d49a8942b1d20a24
      (without the generated aggregate `Imports.lean`). Challenge.lean and Solution.lean were
      added for the Palomar submission. Other Lean formalizations of Vizing's theorem exist; this
      is not claimed to be the first.

status:
  scope: >-
    Proved for every finite simple graph with decidable adjacency: Vizing's upper bound in
    colourability and chromatic-number form, and equitable proper edge colourings on every palette
    Fin c with c ≥ Δ + 1; the lower bound χ' ≥ Δ and the dichotomy χ' ∈ {Δ, Δ + 1} (version 2),
    including graphs on an empty vertex type. Deciding which of the two classes a graph belongs to
    is not addressed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        AI-assisted development under the author's direction (the Lean proof provenance is
        recorded as AI in Lean Pool): the fan / Kempe development, the equitable rebalancing,
        the port to the Lean Pool pin and the Palomar packaging, checked with `lake build` and
        `#print axioms` (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Version 2: adapted the lower bound from the author's Erdős #81 Paper V formalization
        (LeanPool/Vizing/LowerBound.lean, without its non-emptiness hypothesis) and added the
        class 1 / class 2 dichotomy; checked with a local build, a pp.all comparison of the five
        Challenge/Solution declarations and #print axioms.
      cost:
        wall_time: "under an hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results and the route were chosen by the human author; the Lean proofs are AI-generated
    and mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and
    Quot.sound, identical elaborated types for each Challenge/Solution pair).

fidelity:
  divergences: >-
    Edge colourings are stated through Mathlib's line graph for Vizing's theorem; for the
    equitable statement a colouring is a function `Sym2 V → Fin c`, proper meaning that two
    distinct edges of G with the same colour share no vertex, and equitable meaning that the
    colour classes (subsets of G.edgeFinset, unused colours giving empty classes) differ in size
    by at most one. Vertex types are arbitrary finite types with decidable adjacency.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent compared
    each Challenge statement with the sources (Vizing 1964 for the upper bound; McDiarmid 1972 for
    the equitable statement), checked that the Mathlib notions used (line graph, colourability,
    chromatic number, edge finset, Sym2 membership) express them, checked that the copied library
    modules are identical to the merged Lean Pool sources, and confirmed by `lake build`,
    `#print axioms` and a comparison of the fully elaborated Challenge and Solution types that the
    proofs use no `sorry` and only propext, Classical.choice and Quot.sound. The author directed
    the work and approved the statements. No independent human mathematical review has been
    performed. The results are classical and no mathematical novelty is claimed.

alignment:
  namespace: "Vizing"
  statements:
    - source: "Vizing (1964)"
      lean: "Vizing.lineGraph_colorable"
      module: "Challenge"
      status: "proved"
      note: "The line graph of G is (Δ(G) + 1)-colourable."
    - source: "Vizing (1964), chromatic-index form"
      lean: "Vizing.lineGraph_chromaticNumber_le"
      module: "Challenge"
      status: "proved"
      note: "χ'(G) ≤ Δ(G) + 1."
    - source: "McDiarmid (1972), equitable edge colourings, with k = Δ + 1 from Vizing"
      lean: "Vizing.exists_equitable_edge_colouring"
      module: "Challenge"
      status: "proved"
      note: "For c ≥ Δ(G) + 1 there is a proper edge colouring with colours Fin c whose classes differ in size by at most one."
    - source: "Lower bound for the chromatic index (classical)"
      lean: "Vizing.maxDegree_le_lineGraph_chromaticNumber"
      module: "Challenge"
      status: "proved"
      note: "Δ(G) ≤ χ'(G)."
    - source: "Vizing (1964), class 1 / class 2"
      lean: "Vizing.lineGraph_chromaticNumber_eq_or"
      module: "Challenge"
      status: "proved"
      note: "χ'(G) = Δ(G) or χ'(G) = Δ(G) + 1."

acknowledgements: >-
  Mathlib and the Lean community; Lean Pool.
